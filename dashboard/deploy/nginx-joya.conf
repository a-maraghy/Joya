# JOYA admin dashboard — TLS termination and reverse proxy.
#
# Port 80 here serves ONLY the ACME http-01 challenge for certificate renewal.
# It deliberately does not proxy the dashboard, leaving 80 free for other
# services later (add them as separate server blocks / locations).

limit_req_zone $binary_remote_addr zone=joya_login:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name joya.example.com;

    # Let's Encrypt renewal challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}

server {
    # nginx 1.24 (Ubuntu 24.04) uses the `listen ... http2` form; the standalone
    # `http2 on;` directive only exists from nginx 1.25.1.
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name joya.example.com;

    ssl_certificate     /etc/letsencrypt/live/joya.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/joya.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:JoyaSSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Do not advertise the nginx version to scanners.
    server_tokens off;

    # Large enough for what the console actually posts: an attached file or a
    # recorded utterance, base64'd into a JSON body, against the 44MB the
    # application itself accepts on those two routes. It was 128k, which is
    # smaller than a photograph and smaller than ten seconds of audio -- so
    # every attachment past about 48KB was refused by nginx before the panel
    # ever saw it, and the browser reported only a bare 413.
    client_max_body_size 48m;

    access_log /var/log/nginx/joya-access.log;
    error_log  /var/log/nginx/joya-error.log;

    # Rate-limit the endpoints that accept credentials. burst allows a few
    # legitimate retries (mistyped TOTP) without tripping.
    location = /login {
        limit_req zone=joya_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/joya-proxy-params;
    }

    location = /pair {
        limit_req zone=joya_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/joya-proxy-params;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/joya-proxy-params;
    }
}
